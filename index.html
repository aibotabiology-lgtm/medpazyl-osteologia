/* Layout: a calm atlas — white plates for figures, one sky-blue accent, ink-black type; a single column app shell, modules as a numbered course list. */
:root{
  --sky:#64BFEC; --sky-ink:#1B7DB0; --sky-soft:#E4F4FC; --ink:#0D1820; --ink-2:#4A5B66; --line:#DCE7EE;
  --bg:#F6FAFC; --surface:#FFFFFF; --plate:#FFFFFF; --ok:#1E9E6A; --ok-soft:#E3F6EE; --bad:#D9434E; --bad-soft:#FCE9EA;
  --f-ui:"JUZ40",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-lat:"Spectral",Georgia,"Times New Roman",serif;
  --r:14px; --shadow:0 1px 2px rgba(13,24,32,.06),0 8px 24px rgba(13,24,32,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky:#64BFEC; --sky-ink:#8FD3F5; --sky-soft:#13303F; --ink:#EAF3F8; --ink-2:#9DB2BF; --line:#22333E;
  --bg:#0A131A; --surface:#111D25; --plate:#FFFFFF; --ok:#3CC58C; --ok-soft:#10322A; --bad:#F06B73; --bad-soft:#3A1A1E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#64BFEC; --sky-ink:#8FD3F5; --sky-soft:#13303F; --ink:#EAF3F8; --ink-2:#9DB2BF; --line:#22333E;
  --bg:#0A131A; --surface:#111D25; --plate:#FFFFFF; --ok:#3CC58C; --ok-soft:#10322A; --bad:#F06B73; --bad-soft:#3A1A1E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--sky-ink)}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:6px}
.lat{font-family:var(--f-lat);font-style:italic;font-weight:500;letter-spacing:.005em}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px}
h1,h2,h3{text-wrap:balance;line-height:1.15;margin:0}
.muted{color:var(--ink-2)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--sky-ink);font-weight:700}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700;letter-spacing:.02em}
.brand img{width:34px;height:34px;border-radius:9px}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--ink-2);letter-spacing:0}
.bar .sp{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:14px}
.iconbtn:hover{border-color:var(--sky)}

/* gate */
.gate{min-height:100%;display:grid;place-items:center;padding:48px 16px}
.gate-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:32px 26px;box-shadow:var(--shadow);text-align:center;display:grid;gap:18px}
.gate-card img.logo{width:72px;height:72px;border-radius:18px;margin:0 auto}
.gate-card h1{font-size:30px;letter-spacing:.01em}
.gate-card form{display:grid;gap:10px}
.code-in{width:100%;font:inherit;font-size:20px;letter-spacing:.18em;text-align:center;text-transform:uppercase;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.code-in:focus{outline:none;border-color:var(--sky)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 20px;font-weight:700;background:var(--ink);color:var(--bg);text-decoration:none;font-size:15px}
.btn:hover{filter:brightness(1.12)}
.btn.sky{background:var(--sky);color:#06202E}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--sky)}
.btn[disabled]{opacity:.45;cursor:default}

/* ===== Settings =====

    if(l.startsWith('- ')||l.startsWith('• ')){(list=list||[]).push('<li>'+inline(l.slice(2))+'</li>');continue}

/* ---------- data ---------- */
let INDEX=null;const CACHE={};
async function getIndex(){if(!INDEX){const r=await fetch('data/index.json');INDEX=await r.json()}return INDEX}

function stage(fig,{hot=[],marks={},pick=null,maxH=0.62,numbers=false}={}){

  fig.labels.forEach((l,i)=>l.boxes.forEach(b=>{
    const cls=['pill'];if(hot.includes(i))cls.push('hot');if(marks[i])cls.push(marks[i]);if(pick&&!marks[i])cls.push('pick');

/* ---------- gate ---------- */

    inp,h('button',{class:'btn sky',type:'submit'},'Кіру'));

/* ---------- flashcards ---------- */
function renderCards(panel,all,key){
  let filter='all',deck=[],pos=0,known=new Set(store.get(key,[]));let onlyUnknown=false;
  const tb=h('div',{class:'toolbar'});
  const seg=h('div',{class:'seg',role:'group','aria-label':'Карта түрі'});
  [['all','Барлығы'],['bone','Сүйектер'],['part','Бөліктер']].forEach(([k,l])=>seg.append(h('button',{'aria-pressed':String(k==='all'),onclick:e=>{filter=k;seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===e.currentTarget)));build(false)}},l)));
  const unk=h('button',{class:'iconbtn','aria-pressed':'false',onclick:()=>{onlyUnknown=!onlyUnknown;unk.setAttribute('aria-pressed',String(onlyUnknown));unk.textContent=onlyUnknown?'Барлық карталар':'Тек білмейтіндерім';build(false)}},'Тек білмейтіндерім');
  const counter=h('span',{class:'counter'});
  tb.append(seg,h('button',{class:'iconbtn',onclick:()=>build(true)},'Араластыру'),unk,h('span',{class:'sp'}),counter);
  const prog=h('div',{class:'bar-prog'},h('i'));
  const holder=h('div');
  panel.append(tb,prog,holder);
  function build(mix){deck=all.filter(c=>filter==='all'||c.type===filter).filter(c=>!onlyUnknown||!known.has(c.id));if(mix)deck=shuffle(deck);pos=0;show()}
  function show(){
    holder.innerHTML='';
    counter.textContent=deck.length?`${pos+1} / ${deck.length} · білемін: ${deck.filter(c=>known.has(c.id)).length}`:'';
    prog.firstChild.style.width=deck.length?((pos+1)/deck.length*100)+'%':'0';
    if(!deck.length){holder.append(h('div',{class:'empty'},onlyUnknown?'Барлық карталарды білесіз! Жарайсыз.':'Карта жоқ.'));return}
    const c=deck[pos];
    let front;
    if(c.type==='bone')front=h('div',{class:'imgbox'},h('img',{class:'single',src:c.img,alt:'Сүйек суреті'}));
    else front=h('div',{class:'imgbox'},stage(c.fig,{hot:[c.li],maxH:.5}));
    const back=h('div',{class:'face back'},
      h('div',{class:'la lat'},c.la),h('div',{class:'kz'},c.kz),h('div',{class:'ru'},'рус. '+c.ru),
      c.kind?h('div',{class:'kv'},h('b',{},'Түрі'),h('span',{},c.kind)):null,
      c.text?h('div',{class:'kv'},h('b',{},c.type==='bone'?'Қызметі':'Маңызы'),h('span',{},c.text.replace(/^Қызметі:\s*/,''))):null,
      c.facts.length?h('div',{class:'kv'},h('b',{},'Есте сақта'),h('ul',{},c.facts.map(f=>h('li',{},f)))):null);
    const card=h('div',{class:'card',tabindex:'0',role:'button','aria-label':'Картаны аудару',onclick:()=>card.classList.toggle('flip'),onkeydown:e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();card.classList.toggle('flip')}}},
      h('div',{class:'card-in'},
        h('div',{class:'face front'},h('div',{class:'hint'},h('span',{},c.type==='bone'?'Бұл қай сүйек?':'Белгіленген бөлік қалай аталады?'),h('span',{},'басып аударыңыз')),front),back));
    const mark=v=>{if(v)known.add(c.id);else known.delete(c.id);store.set(key,[...known]);go(1)};
    holder.append(card,h('div',{class:'cardnav'},
      h('button',{class:'btn ghost',onclick:()=>go(-1),'aria-label':'Алдыңғы'},'←'),
      h('button',{class:'btn again',onclick:()=>mark(false)},'Қайталау керек'),
      h('button',{class:'btn know',onclick:()=>mark(true)},'Білемін'),
      h('button',{class:'btn ghost',onclick:()=>go(1),'aria-label':'Келесі'},'→')))}
  function go(d){pos=(pos+d+deck.length)%deck.length;show()}
  const key2=e=>{if(!document.body.contains(holder)){removeEventListener('keydown',key2);return}if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)};
  addEventListener('keydown',key2);
  build(true)}

/* ---------- quiz ---------- */
function renderQuiz(panel,questions,id){
  let qs,pos,score,wrong;
  const box=h('div');panel.append(box);
  function start(list){qs=shuffle(list).map(q=>{const order=shuffle(q.o.map((_,i)=>i));return{...q,o:order.map(i=>q.o[i]),why:order.map(i=>(q.why||[])[i]),a:order.indexOf(q.a)}});pos=0;score=0;wrong=[];show()}
  function show(){
    box.innerHTML='';
    if(pos>=qs.length)return finish();
    const q=qs[pos];
    const prog=h('div',{class:'bar-prog'},h('i'));prog.firstChild.style.width=(pos/qs.length*100)+'%';
    const opts=h('div',{class:'opts'});
    const exp=h('div');const foot=h('div',{class:'qfoot'});
    q.o.forEach((o,i)=>opts.append(h('button',{class:'opt',onclick:()=>answer(i)},h('span',{class:'k'},'АБВГД'[i]||String(i+1)),h('span',{},o))));
    function answer(i){
      const ok=i===q.a;if(ok)score++;else wrong.push(questions.find(x=>x.q===q.q));
      [...opts.children].forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===i)b.classList.add('wrong');
        if(q.why[j])b.append(h('span',{class:'why'},q.why[j]))});
      exp.append(h('div',{class:'exp'},h('b',{},ok?'Дұрыс!':'Қате.'),q.exp));
      foot.append(h('span',{class:'score'},`Ұпай: ${score} / ${pos+1}`),h('button',{class:'btn sky',onclick:()=>{pos++;show();box.scrollIntoView({behavior:'smooth',block:'start'})}},pos+1<qs.length?'Келесі сұрақ →':'Нәтижені көру'));
      foot.querySelector('.btn').focus({preventScroll:true})}
    box.append(prog,h('div',{class:'qcard'},h('div',{class:'qnum'},`Сұрақ ${pos+1} / ${qs.length}`),h('div',{class:'qtext'},q.q),opts,exp,foot))}
  function finish(){
    const pct=Math.round(score/qs.length*100);
    if(qs.length===questions.length&&id){const b=store.get('best_'+id,0);if(pct>b)store.set('best_'+id,pct)}
    const msg=pct>=90?'Керемет нәтиже!':pct>=70?'Жақсы! Қателерді қайталап шығыңыз.':'Конспектіні қайта оқып, тағы бір рет тапсырыңыз.';
    box.append(h('div',{class:'qcard result'},h('div',{class:'eyebrow'},'Нәтиже'),h('div',{class:'big'},pct+'%'),h('div',{},`${score} / ${qs.length} дұрыс жауап`),h('p',{class:'muted',style:'margin:0'},msg),
      h('div',{class:'row'},wrong.length?h('button',{class:'btn sky',onclick:()=>start(wrong)},`Қателерді қайталау (${wrong.length})`):null,h('button',{class:'btn ghost',onclick:()=>start(questions)},'Қайта бастау'))))}
  start(questions)}

/* ---------- find on picture ---------- */
function renderFind(panel,m){
  const figs=m.figures.filter(f=>f.labels.length>=3);
  let fig=figs[0],mode='name',order,pos,score,tries;
  const pick=h('div',{class:'figpick',role:'group','aria-label':'Сурет'});
  figs.forEach(f=>pick.append(h('button',{'aria-pressed':String(f===fig),title:f.caption,onclick:e=>{fig=f;pick.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===e.currentTarget)));start()}},f.caption||f.id)));
  const seg=h('div',{class:'seg',role:'group','aria-label':'Режим'});
  [['name','Атауын тап'],['point','Суреттен көрсет']].forEach(([k,l])=>seg.append(h('button',{'aria-pressed':String(k===mode),onclick:e=>{mode=k;seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===e.currentTarget)));start()}},l)));
  const game=h('div',{class:'game'});
  panel.append(h('p',{class:'muted',style:'margin:0 0 10px'},'Суреттегі жазулар жасырылған. «Атауын тап» — белгіленген бөліктің атауын таңдаңыз. «Суреттен көрсет» — аталған бөлікті суреттен басыңыз.'),
    h('div',{class:'toolbar'},seg),pick,h('div',{style:'height:12px'}),game);
  function start(){order=shuffle(fig.labels.map((_,i)=>i));pos=0;score=0;tries=0;show()}
  function show(marks={}){
    game.innerHTML='';
    if(pos>=order.length){game.append(h('div',{class:'qcard result',style:'grid-column:1/-1'},h('div',{class:'eyebrow'},'Сурет аяқталды'),h('div',{class:'big'},Math.round(score/order.length*100)+'%'),h('div',{},`${score} / ${order.length} бірінші әрекеттен дұрыс`),h('div',{class:'row'},h('button',{class:'btn sky',onclick:start},'Қайта бастау'))));return}
    const t=order[pos],L=fig.labels[t];
    const side=h('div',{class:'gside'});const fb=h('div');
    const sc=h('div',{class:'score'},`${pos+1} / ${order.length} · ұпай ${score}`);
    const nextBtn=()=>h('button',{class:'btn sky',onclick:()=>{pos++;show()}},pos+1<order.length?'Келесі →':'Нәтиже');
    if(mode==='name'){
      game.append(stage(fig,{hot:[t],maxH:.7,marks}));
      const distract=sample(fig.labels.map((l,i)=>i).filter(i=>i!==t&&fig.labels[i].kz!==L.kz&&fig.labels[i].la!==L.la),3);
      const opts=shuffle([t,...distract]);const go=h('div',{class:'gopts'});let first=true;
      opts.forEach(i=>go.append(h('button',{class:'gopt',onclick:e=>{
        const ok=i===t;const b=e.currentTarget;
        if(ok){if(first)score++;b.classList.add('correct');go.querySelectorAll('button').forEach(x=>x.disabled=true);
          fb.className='fb ok';fb.innerHTML=`<b>Дұрыс:</b> <span class="lat">${esc(L.la)}</span> — ${esc(L.kz)}${L.note?'<br>'+esc(L.note):''}`;side.append(nextBtn())}
        else{first=false;b.classList.add('wrong');b.disabled=true;fb.className='fb bad';fb.innerHTML=`Жоқ, бұл — <b>${esc(fig.labels[i].kz)}</b>. Тағы байқап көріңіз.`}
        sc.textContent=`${pos+1} / ${order.length} · ұпай ${score}`}},h('span',{class:'lat'},fig.labels[i].la),h('small',{},fig.labels[i].kz))));
      side.append(h('div',{class:'prompt'},h('div',{class:'q'},'Белгіленген (?) бөлік қалай аталады?')),go,fb,sc)}
    else{
      let first=true;const mk={};
      const redraw=done=>{const s=stage(fig,{maxH:.7,marks:mk,pick:done?null:onPick});if(game.firstChild&&game.firstChild.classList.contains('stage'))game.replaceChild(s,game.firstChild);else game.prepend(s)};
      function onPick(i){
        if(i===t||fig.labels[i].la===L.la){if(first)score++;mk[i]='ok';redraw(true);
          fb.className='fb ok';fb.innerHTML=`<b>Дұрыс!</b>${L.note?' '+esc(L.note):''}`;side.append(nextBtn())}
        else{first=false;mk[i]='bad';redraw(false);fb.className='fb bad';fb.innerHTML=`Бұл — <span class="lat">${esc(fig.labels[i].la)}</span> (${esc(fig.labels[i].kz)}). Тағы іздеңіз.`}
        sc.textContent=`${pos+1} / ${order.length} · ұпай ${score}`}
      redraw(false);
      side.append(h('div',{class:'prompt'},h('div',{class:'q'},'Суреттен көрсетіңіз:'),h('div',{class:'q',style:'margin-top:6px'},h('span',{class:'lat'},L.la)),h('div',{class:'muted'},L.kz)),fb,sc)}
    game.append(side)}
  if(!figs.length){panel.append(h('div',{class:'empty'},'Бұл модульде сурет жоқ.'));return}
  start()}

/* ---------- mixed modes ---------- */
async function renderMix(kind){

  const main=h('main',{class:'wrap'},h('div',{class:'loading'},'Жүктелуде…'));app.append(main);

/* ---------- router ---------- */
async function route(){
  if(!unlocked)return renderGate();
  const t=(location.hash||'#home').slice(1);
  scrollTo(0,0);
  if(t==='mix_cards')return renderMix('cards');
  if(t==='mix_quiz')return renderMix('quiz');
  const m=t.match(/^(t\d\d)(?:_(notes|cards|quiz|find))?$/);
  if(m)return renderModule(m[1],m[2]||'notes');
  return renderHome()}
addEventListener('hashchange',route);
route().catch(e=>{$('#app').innerHTML='<div class="empty">Деректер жүктелмеді. Бетті жаңартып көріңіз.</div>';console.error(e)});

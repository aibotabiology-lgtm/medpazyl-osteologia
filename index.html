<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}html,body{margin:0}img{max-width:100%}</style>
<title>MedPazyl Остеология</title>
<meta name="description" content="Остеология — анатомияға апарар алғашқы қадам. Конспект, флэш-карталар, тест және суреттен табу тапсырмалары.">
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600;1,700&display=swap">
<style>
/* Layout: a calm atlas — white plates for figures, one royal-blue primary, one orange accent for progress; single column app shell, modules as a numbered course list. Light only. */
:root{
  --blue:#0038BD; --blue-ink:#0038BD; --blue-soft:#EAF0FC; --orange:#F98613; --orange-soft:#FFF2E5; --orange-ink:#C2600A;
  --ink:#171717; --ink-2:#737373; --line:#E5E5E5;
  --bg:#F7F8FC; --surface:#FFFFFF; --plate:#FFFFFF; --ok:#1E9E6A; --ok-soft:#E3F6EE; --bad:#D9434E; --bad-soft:#FCE9EA;
  --f-ui:"Nunito",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-lat:"Nunito",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(23,23,23,.05),0 8px 24px rgba(23,23,23,.05);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:6px}
.lat{font-family:var(--f-lat);font-style:italic;font-weight:600;color:var(--blue)}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px}
h1,h2,h3{text-wrap:balance;line-height:1.15;margin:0;font-weight:800}
.muted{color:var(--ink-2)}
.eyebrow{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:800}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:800;letter-spacing:.01em}
.brand img{width:36px;height:36px;border-radius:9px}
.brand small{display:block;font-weight:600;font-size:12.5px;color:var(--ink-2);letter-spacing:0}
.bar .sp{flex:1}
.iconbtn{display:inline-flex;align-items:center;min-height:44px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;font-size:15px;font-weight:700;color:var(--ink);text-decoration:none}
.iconbtn:hover{border-color:var(--blue);color:var(--blue)}
.iconbtn[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}

/* gate */
.gate{min-height:100%;display:grid;place-items:center;padding:48px 16px;background:var(--bg)}
.gate-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:32px 26px;box-shadow:var(--shadow);text-align:center;display:grid;gap:18px}
.gate-card img.logo{width:72px;height:72px;border-radius:18px;margin:0 auto}
.gate-card h1{font-size:32px}
.gate-card form{display:grid;gap:10px}
.code-in{width:100%;min-height:56px;font:inherit;font-weight:700;font-size:20px;letter-spacing:.18em;text-align:center;text-transform:uppercase;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.code-in:focus{outline:none;border-color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border:0;border-radius:12px;padding:12px 22px;font-weight:800;font-size:16.5px;background:var(--blue);color:#fff;text-decoration:none}
.btn:hover{filter:brightness(1.12)}
.btn.sky{background:var(--blue);color:#fff}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--blue);color:var(--blue);filter:none}
.btn[disabled]{opacity:.45;cursor:default}
.err{color:var(--bad);font-size:14.5px;min-height:20px}

/* home */
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:24px;align-items:center;padding-block:40px 24px}
.hero h1{font-size:clamp(34px,6vw,58px);font-weight:800;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--blue)}
.hero p{font-size:18px;max-width:52ch;margin:14px 0 0}
.hero-img{position:relative;justify-self:center;width:min(100%,340px)}
.hero-img::before{content:"";position:absolute;inset:8% 6%;border-radius:50%;background:var(--blue-soft)}
.hero-img img{position:relative;width:100%;filter:drop-shadow(0 18px 24px rgba(23,23,23,.16))}
.hero-tag{display:inline-flex;align-items:center;gap:8px;margin-top:6px;font-size:15px;font-weight:600;color:var(--ink-2)}
.tg{display:flex;flex-wrap:wrap;align-items:center;gap:16px 20px;background:var(--blue);color:#fff;border-radius:18px;padding:20px 22px;margin-block:8px 28px}
.tg .tgi{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.tg .tgi svg{fill:var(--blue)}
.tg .tgt{flex:1;min-width:200px}
.tg b{display:block;font-size:17.5px;font-weight:800}
.tg span{opacity:.85;font-size:14.5px}
.tg .btn{background:#fff;color:var(--blue)}
.secthead{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-block:6px 12px}
.secthead h2{font-size:24px}
.mods{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.mod{display:grid;grid-template-columns:46px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.mod .no{width:46px;height:46px;border-radius:12px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:800;font-variant-numeric:tabular-nums}
.mod .t{min-width:0}
.mod .t b{display:block;font-weight:700;font-size:17px;line-height:1.3}
.mod .t .lat{font-size:14.5px}
.mod .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink-2);font-variant-numeric:tabular-nums}
.chip.done{background:var(--orange-soft);border-color:var(--orange);color:var(--orange-ink)}
.mod.soon{opacity:.62}
.mod.soon .no{background:var(--bg);color:var(--ink-2)}
.mod .open{white-space:nowrap}
.soon-tag{font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.mix{display:flex;flex-wrap:wrap;gap:10px;margin-block:18px 48px}
footer{border-top:1px solid var(--line);padding-block:22px 40px;color:var(--ink-2);font-size:13.5px;background:var(--surface)}

/* module */
.mhead{padding-block:22px 6px;display:grid;gap:6px}
.mhead h1{font-size:clamp(26px,4.4vw,38px)}
.mhead .lat{font-size:19px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-block:14px;scrollbar-width:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:10;background:var(--bg)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:9px;min-height:52px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 18px 8px 10px;font-weight:800;font-size:16px}
.tab i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:14px;font-weight:800;color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
.tab[aria-selected="true"] i{background:#fff;color:var(--blue)}
.panel{padding-block:10px 60px}
.next-step{display:flex;justify-content:flex-end;margin-top:28px}

/* conspect */
.intro{font-size:17.5px;max-width:68ch;margin:6px 0 18px;color:var(--ink-2)}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.toc a{display:inline-flex;align-items:center;min-height:40px;font-size:14.5px;font-weight:600;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px}
.toc a:hover{border-color:var(--blue);color:var(--blue)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px clamp(16px,3vw,30px);margin-bottom:14px;scroll-margin-top:140px}
.sec>h2{font-size:22px;margin-bottom:10px}
.prose{max-width:72ch}
.prose p{margin:0 0 12px}
.prose h3{font-size:17.5px;margin:18px 0 8px;color:var(--blue)}
.prose ul{margin:0 0 12px;padding-left:20px}
.prose li{margin:4px 0}
.prose li::marker{color:var(--blue)}
.prose em{font-family:var(--f-lat);font-style:italic;font-weight:600;color:var(--blue)}
.prose blockquote{margin:12px 0;padding:12px 16px;border-radius:12px;background:var(--blue-soft);color:var(--ink)}
.figure{margin:18px 0 6px}
.plate{background:var(--plate);border-radius:14px;border:1px solid var(--line);overflow:hidden;cursor:zoom-in}
.plate img{display:block;width:100%;height:auto}
.figcap{font-size:14.5px;color:var(--ink-2);margin:8px 2px}
details.terms{margin-top:6px}
details.terms summary{cursor:pointer;font-weight:700;color:var(--blue);font-size:15px;padding:10px 0;min-height:44px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin-top:6px}
table.tt{border-collapse:collapse;width:100%;font-size:14.5px;min-width:560px}
.tt th,.tt td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tt th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);background:var(--bg)}
.tt td:first-child{font-variant-numeric:tabular-nums;color:var(--ink-2);width:36px}
.tt tr:last-child td{border-bottom:0}

/* figure stage with pills */
.stage{position:relative;margin:0 auto;background:var(--plate);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.stage img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.pill{position:absolute;border-radius:7px;background:#F1F2F6;border:1.5px solid #D4D4D4;display:grid;place-items:center;font-size:clamp(10px,1.5vw,14px);font-weight:800;color:#737373;padding:0;min-width:16px;min-height:12px}
.pill.hot{background:var(--orange);border-color:#C2600A;color:#fff;box-shadow:0 0 0 4px rgba(249,134,19,.3);animation:pulse 1.6s ease-in-out infinite}
.pill.ok{background:#1E9E6A;border-color:#147A51;color:#fff}
.pill.bad{background:#D9434E;border-color:#A82F38;color:#fff}
.pill.pick{cursor:pointer}
.pill.pick:hover{background:var(--blue-soft);border-color:var(--blue)}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(249,134,19,.12)}}
@media (prefers-reduced-motion: reduce){.pill.hot{animation:none}*{transition:none!important}}

/* flashcards */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{min-height:46px;border:0;background:transparent;border-radius:9px;padding:8px 16px;font-size:15.5px;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.toolbar .sp{flex:1}
.counter{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:14.5px;font-weight:600}
.card{position:relative;perspective:1600px;cursor:pointer;height:clamp(440px,64vh,640px)}
.card-in{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.card.flip .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.face.back{transform:rotateY(180deg);padding:26px clamp(18px,4vw,36px);justify-content:center}
.face .hint{font-size:14px;font-weight:600;color:var(--ink-2);display:flex;justify-content:space-between;gap:10px;align-items:center}
.mastered{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:var(--orange-soft);border:1px solid var(--orange);color:var(--orange-ink);font-weight:800;font-size:13px}
.face .imgbox{flex:1;display:grid;place-items:center;min-height:0;overflow:hidden;position:relative}
.face .imgbox img.single{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.back .la{font-size:clamp(26px,4.5vw,38px);line-height:1.15}
.back .kz{font-size:clamp(20px,3.2vw,26px);font-weight:800}
.back .ru{font-size:15.5px;color:var(--ink-2)}
.back .kv{display:grid;gap:4px;margin-top:6px}
.back .kv b{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.back ul{margin:4px 0 0;padding-left:18px}
.back li{margin:3px 0}
.cardnav{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:8px;margin-top:14px}
.cardnav .btn{min-height:56px;padding:12px 16px;font-size:17px}
.btn.know{background:var(--ok-soft);color:var(--ok)}
.btn.again{background:var(--bad-soft);color:var(--bad)}
.bar-prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:14px}
.bar-prog i{display:block;height:100%;background:var(--orange);transition:width .3s}

/* quiz */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px clamp(16px,3.4vw,32px);box-shadow:var(--shadow)}
.qnum{font-size:14px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-bottom:8px}
.qtext{font-size:clamp(19px,2.6vw,23px);font-weight:700;line-height:1.35;margin-bottom:18px}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;min-height:60px;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:14px 16px;font-size:17px;font-weight:600}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt .k{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-weight:800;font-size:15px}
.opt .why{grid-column:2;font-size:14.5px;font-weight:500;color:var(--ink-2);margin-top:6px;line-height:1.45}
.opt[disabled]{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.exp{margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--blue-soft)}
.exp b{display:block;margin-bottom:4px}
.qfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.result{text-align:center;display:grid;gap:14px;justify-items:center;padding-block:20px}
.result .big{font-size:64px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--orange)}
.result .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* label game */
.game{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.gside{display:grid;gap:12px;position:sticky;top:150px}
.prompt{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.prompt .q{font-size:18px;font-weight:700}
.prompt .q .lat{font-size:19.5px}
.gopts{display:grid;gap:8px}
.gopt{min-height:60px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:16px}
.gopt small{display:block;color:var(--ink-2);font-size:14px;font-weight:600}
.gopt:hover:not([disabled]){border-color:var(--blue)}
.gopt.correct{border-color:var(--ok);background:var(--ok-soft)}
.gopt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.figpick{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.figpick button{flex:none;min-height:46px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;font-size:14.5px;font-weight:700;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.figpick button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.fb{font-size:15px;padding:10px 12px;border-radius:12px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.score{font-variant-numeric:tabular-nums;font-size:14.5px;font-weight:600;color:var(--ink-2)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:rgba(10,10,10,.86);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;background:#fff;border-radius:10px}
.empty{padding:40px 0;text-align:center;color:var(--ink-2)}
.loading{padding:60px 0;text-align:center;color:var(--ink-2)}

@media (max-width:760px){
  .hero{grid-template-columns:1fr;padding-block:24px 10px}
  .hero-img{width:min(64%,240px);grid-row:1}
  .game{grid-template-columns:1fr}
  .gside{position:static}
  .mod{grid-template-columns:40px 1fr;gap:12px}
  .mod .no{width:40px;height:40px}
  .mod .open,.mod .soon-tag{grid-column:2;justify-self:start}
  .card{height:clamp(440px,70vh,620px)}
}
</style>

</head>
<body>
<div id="app"><div class="loading">Жүктелуде…</div></div>

<script>
/* ===== Settings =====
   ACCESS_HASHES: SHA-256 hashes of access codes (uppercase). Generate a new one:
   in a browser console run  sha256("ЖАҢАКОД")  on this page, or use tools/addcode.py.  */
const ACCESS_HASHES = ["c4bd0f6350965a8c48da0cca720bb1db552aac95e108ac17229258f0ac4ae63f"];
const TELEGRAM = "https://t.me/nurmedacademy";

/* ---------- tiny SHA-256 (works without HTTPS) ---------- */
function sha256(ascii){function r(n,x){return(x>>>n)|(x<<(32-n))}var mp=Math.pow,maxWord=mp(2,32),result='',words=[],asciiBitLength=ascii.length*8,hash=[],k=[],primeCounter=0,isComposite={};for(var c=2;primeCounter<64;c++){if(!isComposite[c]){for(var i=0;i<313;i+=c)isComposite[i]=c;hash[primeCounter]=(mp(c,.5)*maxWord)|0;k[primeCounter++]=(mp(c,1/3)*maxWord)|0}}hash=hash.slice(0,8);ascii=unescape(encodeURIComponent(ascii));asciiBitLength=ascii.length*8;ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';for(i=0;i<ascii.length;i++){var j=ascii.charCodeAt(i);words[i>>2]|=j<<((3-i)%4)*8}words[words.length]=((asciiBitLength/maxWord)|0);words[words.length]=(asciiBitLength);for(j=0;j<words.length;){var w=words.slice(j,j+=16),oldHash=hash;hash=hash.slice(0,8);for(i=0;i<64;i++){var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4],temp1=hash[7]+(r(6,e)^r(11,e)^r(25,e))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(r(7,w15)^r(18,w15)^(w15>>>3))+w[i-7]+(r(17,w2)^r(19,w2)^(w2>>>10)))|0),temp2=(r(2,a)^r(13,a)^r(22,a))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));hash=[(temp1+temp2)|0].concat(hash);hash[4]=(hash[4]+temp1)|0}for(i=0;i<8;i++)hash[i]=(hash[i]+oldHash[i])|0}for(i=0;i<8;i++){for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;result+=((b<16)?0:'')+b.toString(16)}}return result}

/* ---------- storage (optional) ---------- */
const store={get(k,d){try{const v=localStorage.getItem('osteo_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('osteo_'+k,JSON.stringify(v))}catch(e){}}};
let unlocked=store.get('ok',false);

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const h=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v)}for(const k of kids.flat()){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(k))}return e};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(a,n)=>shuffle(a).slice(0,n);
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>')}
function md(src){const out=[];let list=null;const flush=()=>{if(list){out.push('<ul>'+list.join('')+'</ul>');list=null}};
  for(const block of String(src||'').split(/\n\s*\n/)){for(const raw of block.split('\n')){const l=raw.trim();if(!l)continue;
    if(l.startsWith('- ')||l.startsWith('• ')){(list=list||[]).push('<li>'+inline(l.slice(2))+'</li>');continue}
    flush();
    if(l.startsWith('### '))out.push('<h3>'+inline(l.slice(4))+'</h3>');
    else if(l.startsWith('> '))out.push('<blockquote>'+inline(l.slice(2))+'</blockquote>');
    else out.push('<p>'+inline(l)+'</p>')}flush()}
  return out.join('')}

/* ---------- data ---------- */
let INDEX=null;const CACHE={};
async function getIndex(){if(!INDEX){const r=await fetch('data/index.json');INDEX=await r.json()}return INDEX}
async function getMod(id){if(!CACHE[id]){const r=await fetch('data/'+id+'.json');CACHE[id]=await r.json()}return CACHE[id]}
function cardsOf(m){
  const out=[];
  for(const b of m.bones)out.push({type:'bone',mod:m.id,id:'b:'+b.id,img:b.img,la:b.la,kz:b.kz,ru:b.ru,kind:b.type,text:b.func,facts:b.facts||[]});
  for(const f of m.figures)f.labels.forEach((l,i)=>out.push({type:'part',mod:m.id,id:'p:'+f.id+':'+i,fig:f,li:i,la:l.la,kz:l.kz,ru:l.ru,text:l.note,facts:[]}));
  return out}

/* ---------- figure stage ---------- */
function stage(fig,{hot=[],marks={},pick=null,maxH=0.62,numbers=false}={}){
  const ar=fig.w/fig.h;
  const s=h('div',{class:'stage'});
  s.style.aspectRatio=fig.w+' / '+fig.h;
  s.style.maxWidth=`min(100%, calc(${maxH*100}vh * ${ar.toFixed(4)}))`;
  s.append(h('img',{src:fig.clean,alt:fig.caption||'',loading:'lazy',draggable:'false'}));
  fig.labels.forEach((l,i)=>l.boxes.forEach(b=>{
    const cls=['pill'];if(hot.includes(i))cls.push('hot');if(marks[i])cls.push(marks[i]);if(pick&&!marks[i])cls.push('pick');
    const p=h(pick?'button':'span',{class:cls.join(' '),'aria-label':pick?('Белгі '+(i+1)):null},hot.includes(i)?'?':(numbers?String(i+1):''));
    p.style.left=(b[0]*100)+'%';p.style.top=(b[1]*100)+'%';p.style.width=(b[2]*100)+'%';p.style.height=(b[3]*100)+'%';
    if(pick)p.addEventListener('click',e=>{e.stopPropagation();pick(i)});
    s.append(p)}));
  return s}
function lightbox(src){const lb=h('div',{class:'lb',onclick:()=>lb.remove(),role:'dialog'},h('img',{src,alt:''}));document.body.append(lb);
  const k=e=>{if(e.key==='Escape'){lb.remove();removeEventListener('keydown',k)}};addEventListener('keydown',k)}

function renderCards(panel,all,key){

    prog.firstChild.style.width=deck.length?((pos+1)/deck.length*100)+'%':'0';
    if(!deck.length){holder.append(h('div',{class:'empty'},onlyUnknown?'Барлық карталарды білесіз! Жарайсыз.':'Карта жоқ.'));return}

    const card=h('div',{class:'card',tabindex:'0',role:'button','aria-label':'Картаны аудару',onclick:()=>card.classList.toggle('flip'),onkeydown:e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();card.classList.toggle('flip')}}},
      h('div',{class:'card-in'},
        h('div',{class:'face front'},h('div',{class:'hint'},h('span',{},c.type==='bone'?'Бұл қай сүйек?':'Белгіленген бөлік қалай аталады?'),known.has(c.id)?h('span',{class:'mastered'},'✓ карта меңгерілді'):h('span',{},'басып аударыңыз')),front),back));

/* ---------- quiz ---------- */
function renderQuiz(panel,questions,id){
  let qs,pos,score,wrong;
  const box=h('div');panel.append(box);
  function start(list){qs=shuffle(list).map(q=>{const order=shuffle(q.o.map((_,i)=>i));return{...q,o:order.map(i=>q.o[i]),why:order.map(i=>(q.why||[])[i]),a:order.indexOf(q.a)}});pos=0;score=0;wrong=[];show()}
  function show(){
    box.innerHTML='';
    if(pos>=qs.length)return finish();
    const q=qs[pos];
    const prog=h('div',{class:'bar-prog'},h('i'));prog.firstChild.style.width=(pos/qs.length*100)+'%';
    const opts=h('div',{class:'opts'});
    const exp=h('div');const foot=h('div',{class:'qfoot'});
    q.o.forEach((o,i)=>opts.append(h('button',{class:'opt',onclick:()=>answer(i)},h('span',{class:'k'},'АБВГД'[i]||String(i+1)),h('span',{},o))));
    function answer(i){
      const ok=i===q.a;if(ok)score++;else wrong.push(questions.find(x=>x.q===q.q));
      [...opts.children].forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===i)b.classList.add('wrong');
        if(q.why[j])b.append(h('span',{class:'why'},q.why[j]))});
      exp.append(h('div',{class:'exp'},h('b',{},ok?'Дұрыс!':'Қате.'),q.exp));
      foot.append(h('span',{class:'score'},`Ұпай: ${score} / ${pos+1}`),h('button',{class:'btn sky',onclick:()=>{pos++;show();box.scrollIntoView({behavior:'smooth',block:'start'})}},pos+1<qs.length?'Келесі сұрақ →':'Нәтижені көру'));
      foot.querySelector('.btn').focus({preventScroll:true})}
    box.append(prog,h('div',{class:'qcard'},h('div',{class:'qnum'},`Сұрақ ${pos+1} / ${qs.length}`),h('div',{class:'qtext'},q.q),opts,exp,foot))}
  function finish(){
    const pct=Math.round(score/qs.length*100);
    if(qs.length===questions.length&&id){const b=store.get('best_'+id,0);if(pct>b)store.set('best_'+id,pct)}
    const msg=pct>=90?'Керемет нәтиже!':pct>=70?'Жақсы! Қателерді қайталап шығыңыз.':'Конспектіні қайта оқып, тағы бір рет тапсырыңыз.';
    box.append(h('div',{class:'qcard result'},h('div',{class:'eyebrow'},'Нәтиже'),h('div',{class:'big'},pct+'%'),h('div',{},`${score} / ${qs.length} дұрыс жауап`),h('p',{class:'muted',style:'margin:0'},msg),
      h('div',{class:'row'},wrong.length?h('button',{class:'btn sky',onclick:()=>start(wrong)},`Қателерді қайталау (${wrong.length})`):null,h('button',{class:'btn ghost',onclick:()=>start(questions)},'Қайта бастау'))))}
  start(questions)}

    h('div',{class:'toolbar'},seg),pick,h('div',{style:'height:12px'}),game);
  function start(){order=shuffle(fig.labels.map((_,i)=>i));pos=0;score=0;tries=0;show()}
  function show(marks={}){
    game.innerHTML='';
    if(pos>=order.length){game.append(h('div',{class:'qcard result',style:'grid-column:1/-1'},h('div',{class:'eyebrow'},'Сурет аяқталды'),h('div',{class:'big'},Math.round(score/order.length*100)+'%'),h('div',{},`${score} / ${order.length} бірінші әрекеттен дұрыс`),h('div',{class:'row'},h('button',{class:'btn sky',onclick:start},'Қайта бастау'))));return}
    const t=order[pos],L=fig.labels[t];
    const side=h('div',{class:'gside'});const fb=h('div');

    if(mode==='name'){
      game.append(stage(fig,{hot:[t],maxH:.7,marks}));
      const distract=sample(fig.labels.map((l,i)=>i).filter(i=>i!==t&&fig.labels[i].kz!==L.kz&&fig.labels[i].la!==L.la),3);
      const opts=shuffle([t,...distract]);const go=h('div',{class:'gopts'});let first=true;
      opts.forEach(i=>go.append(h('button',{class:'gopt',onclick:e=>{
        const ok=i===t;const b=e.currentTarget;
        if(ok){if(first)score++;b.classList.add('correct');go.querySelectorAll('button').forEach(x=>x.disabled=true);
          fb.className='fb ok';fb.innerHTML=`<b>Дұрыс:</b> <span class="lat">${esc(L.la)}</span> — ${esc(L.kz)}${L.note?'<br>'+esc(L.note):''}`;side.append(nextBtn())}
        else{first=false;b.classList.add('wrong');b.disabled=true;fb.className='fb bad';fb.innerHTML=`Жоқ, бұл — <b>${esc(fig.labels[i].kz)}</b>. Тағы байқап көріңіз.`}
        sc.textContent=`${pos+1} / ${order.length} · ұпай ${score}`}},h('span',{class:'lat'},fig.labels[i].la),h('small',{},fig.labels[i].kz))));
      side.append(h('div',{class:'prompt'},h('div',{class:'q'},'Белгіленген (?) бөлік қалай аталады?')),go,fb,sc)}
    else{
      let first=true;const mk={};
      const redraw=done=>{const s=stage(fig,{maxH:.7,marks:mk,pick:done?null:onPick});if(game.firstChild&&game.firstChild.classList.contains('stage'))game.replaceChild(s,game.firstChild);else game.prepend(s)};
      function onPick(i){
        if(i===t||fig.labels[i].la===L.la){if(first)score++;mk[i]='ok';redraw(true);
          fb.className='fb ok';fb.innerHTML=`<b>Дұрыс!</b>${L.note?' '+esc(L.note):''}`;side.append(nextBtn())}
        else{first=false;mk[i]='bad';redraw(false);fb.className='fb bad';fb.innerHTML=`Бұл — <span class="lat">${esc(fig.labels[i].la)}</span> (${esc(fig.labels[i].kz)}). Тағы іздеңіз.`}
        sc.textContent=`${pos+1} / ${order.length} · ұпай ${score}`}
      redraw(false);
      side.append(h('div',{class:'prompt'},h('div',{class:'q'},'Суреттен көрсетіңіз:'),h('div',{class:'q',style:'margin-top:6px'},h('span',{class:'lat'},L.la)),h('div',{class:'muted'},L.kz)),fb,sc)}
    game.append(side)}
  if(!figs.length){panel.append(h('div',{class:'empty'},'Бұл модульде сурет жоқ.'));return}
  start()}

/* ---------- mixed modes ---------- */
async function renderMix(kind){
  const app=$('#app');app.innerHTML='';app.append(topbar());
  const main=h('main',{class:'wrap'},h('div',{class:'loading'},'Жүктелуде…'));app.append(main);
  const idx=await getIndex();const mods=await Promise.all(idx.filter(m=>m.ready).map(m=>getMod(m.id)));
  main.innerHTML='';
  main.append(h('div',{class:'mhead'},h('div',{class:'eyebrow'},'Барлық дайын модульдер'),h('h1',{},kind==='cards'?'Аралас флэш-карталар':'Аралас тест'),h('div',{class:'muted'},mods.map(m=>m.title).join(' · '))));
  const panel=h('section',{class:'panel'});main.append(panel);
  if(kind==='cards')renderCards(panel,mods.flatMap(cardsOf),'cards_mix');
  else renderQuiz(panel,sample(mods.flatMap(m=>m.quiz),30),null)}

/* ---------- router ---------- */
async function route(){
  if(!unlocked)return renderGate();
  const t=(location.hash||'#home').slice(1);
  scrollTo(0,0);
  if(t==='mix_cards')return renderMix('cards');
  if(t==='mix_quiz')return renderMix('quiz');
  const m=t.match(/^(t\d\d)(?:_(notes|cards|quiz|find))?$/);
  if(m)return renderModule(m[1],m[2]||'notes');
  return renderHome()}
addEventListener('hashchange',route);
route().catch(e=>{$('#app').innerHTML='<div class="empty">Деректер жүктелмеді. Бетті жаңартып көріңіз.</div>';console.error(e)});
</script>
